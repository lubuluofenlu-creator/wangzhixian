<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王智贤 - 个人主页</title>
<style>
  /* 苹果官网经典字体与重置 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background-color: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* 顶部导航栏 - 毛玻璃效果 */
  .nav {
    position: fixed;
    top: 0;
    width: 100%;
    height: 48px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    z-index: 1000;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .nav span { color: #1d1d1f; }

  /* 首屏大标题区 */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
    background: #fff;
    padding-top: 48px;
    position: relative;
  }
  .hero h1 {
    font-size: clamp(56px, 15vw, 160px);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #1d1d1f;
    margin-bottom: 8px;
  }
  .hero .subtitle {
    font-size: clamp(18px, 4vw, 28px);
    color: #86868b;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .hero .tagline {
    margin-top: 16px;
    font-size: clamp(14px, 3vw, 18px);
    color: #86868b;
    font-weight: 400;
  }
  .scroll-hint {
    position: absolute;
    bottom: 40px;
    font-size: 13px;
    color: #86868b;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(6px); opacity: 1; }
  }

  /* 通用区块 */
  section {
    max-width: 980px;
    margin: 0 auto;
    padding: 80px 24px;
  }
  section h2 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #1d1d1f;
    margin-bottom: 32px;
  }

  /* 个人档案卡片 */
  .profile-card {
    display: flex;
    align-items: center;
    gap: 32px;
    background: #fff;
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
  }
  .profile-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0071e3, #42a5f5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }
  .profile-info h3 {
    font-size: 24px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 8px;
  }
  .profile-info p {
    font-size: 15px;
    color: #86868b;
    line-height: 1.8;
  }

  /* 关于他 - 网格卡片 */
  .facts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  .fact-card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
  }
  .fact-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
  }
  .fact-card .icon {
    font-size: 32px;
    margin-bottom: 12px;
  }
  .fact-card .label {
    font-size: 13px;
    color: #86868b;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .fact-card .value {
    font-size: 18px;
    font-weight: 600;
    color: #1d1d1f;
  }

  /* 详细简介文本 */
  .about-text {
    background: #fff;
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
  }
  .about-text p {
    font-size: 16px;
    color: #424245;
    margin-bottom: 20px;
    line-height: 1.8;
    text-align: justify;
  }
  .about-text p:last-child { margin-bottom: 0; }
  .highlight {
    color: #0071e3;
    font-weight: 500;
  }

  /* 评论区 */
  .comment-section {
    background: #fff;
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
  }
  .comment-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 32px;
  }
  .comment-form input,
  .comment-form textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    background: #f5f5f7;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .comment-form input:focus,
  .comment-form textarea:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    background: #fff;
  }
  .comment-form textarea {
    min-height: 100px;
    resize: vertical;
  }
  .comment-form button {
    align-self: flex-end;
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 980px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    font-family: inherit;
  }
  .comment-form button:hover {
    background: #0077ed;
    transform: scale(1.02);
  }
  .comment-form button:active {
    transform: scale(0.98);
  }

  /* 评论列表 */
  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    border-top: 1px solid #f0f0f2;
    padding-top: 24px;
  }
  .comment-item {
    display: flex;
    gap: 16px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .comment-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e8e8ed;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #86868b;
    flex-shrink: 0;
  }
  .comment-content {
    flex: 1;
  }
  .comment-content .name {
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 4px;
  }
  .comment-content .text {
    font-size: 15px;
    color: #424245;
    line-height: 1.6;
  }
  .comment-content .time {
    font-size: 12px;
    color: #86868b;
    margin-top: 6px;
  }
  .no-comment {
    text-align: center;
    color: #86868b;
    font-size: 14px;
    padding: 20px 0;
  }

  /* 页脚 */
  footer {
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
    color: #86868b;
    border-top: 1px solid #d2d2d7;
    max-width: 980px;
    margin: 0 auto;
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .profile-card {
      flex-direction: column;
      text-align: center;
      padding: 32px 24px;
    }
    .about-text, .comment-section {
